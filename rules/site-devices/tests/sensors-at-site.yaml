# Two sensors at one site: the site is expected once, listed after the sensors, with both linked under it.
# The second sensor reports the site's region, so the site, which the first input created, is linked under it.
inputs:
  - payload: '{"site": "North", "temperature": 21.5}'
    payloadFormat: json
    topic: "sites/north/temperature"
    clientID: "sensor01"
    time: "2026-01-01T12:00:00.000Z"
  - payload: '{"site": "North", "region": "East", "temperature": 19}'
    payloadFormat: json
    topic: "sites/north/temperature"
    clientID: "sensor02"
    time: "2026-01-01T12:01:00.000Z"

expectedDeviceCreation:
  objects:
    - cumulocityType: device
      externalSource:
        - type: c8y_Serial
          externalId: sensor02
      managedObject:
        name: Sensor sensor02
        type: acme_TemperatureSensor
        c8y_Hardware:
          serialNumber: sensor02
        c8y_IsDevice: {}
        com_cumulocity_model_Agent: {}
    - cumulocityType: device
      externalSource:
        - type: c8y_Serial
          externalId: sensor01
      managedObject:
        name: Sensor sensor01
        type: acme_TemperatureSensor
        c8y_Hardware:
          serialNumber: sensor01
        c8y_IsDevice: {}
        com_cumulocity_model_Agent: {}
    - cumulocityType: asset
      externalSource:
        - type: acme_SiteId
          externalId: north
      managedObject:
        type: acme_Site
        name: Site north
        c8y_IsAsset: {}
        c8y_IsDeviceGroup: {}
    - cumulocityType: asset
      externalSource:
        - type: acme_RegionId
          externalId: east
      managedObject:
        type: acme_Region
        name: Region east
        c8y_IsAsset: {}
        c8y_IsDeviceGroup: {}
  links:
    - parent:
        type: acme_SiteId
        externalId: north
      child: 0
      relation: childAssets
    - parent:
        type: acme_SiteId
        externalId: north
      child: 1
      relation: childAssets
    - parent:
        type: acme_RegionId
        externalId: east
      child: 2
      relation: childAssets
